<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AscentFinancials</title>
<meta name="theme-color" content="#17141D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ══════════════════════════════════════════════════════════
   AscentFinancials · v1
   Sistema visual: "carbón y cinta métrica"
   La app se usa de noche, en la calle, antes de gastar.
   ══════════════════════════════════════════════════════════ */
:root{
  --noche:#17141D;      /* fondo */
  --carbon:#211C2B;     /* superficie */
  --carbon2:#2A2436;    /* superficie elevada */
  --linea:#403852;
  --tiza:#EDE9F5;       /* texto */
  --humo:#A79CBA;       /* texto secundario */
  --tenue:#786E8C;
  --salida:#B39DE8;     /* SOLO la fecha de salida y el progreso */
  --alerta:#F0C862;
  --sangre:#FF8A8A;
  --sombra:0 2px 14px rgba(0,0,0,.45);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--noche);color:var(--tiza)}
body{
  font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
  min-height:100vh;padding-bottom:96px;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;border:none;background:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--salida);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── estructura ─── */
.wrap{max-width:480px;margin:0 auto;padding:0 18px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);font-weight:500}
.card{background:var(--carbon);border:1px solid var(--linea);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.sect{margin-top:26px}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}

/* ─── cabecera ─── */
header{padding:22px 0 4px;display:flex;justify-content:space-between;align-items:center}
.marca{font-size:15px;font-weight:700;letter-spacing:-.01em}
.marca span{color:var(--salida)}
.mes-ind{font-size:11px;color:var(--tenue);letter-spacing:.1em;text-transform:uppercase}
.cabecera-der{display:flex;align-items:center;gap:9px}
.nube{font-size:11px;padding:5px 9px;border-radius:99px;border:1px solid var(--linea);
  color:var(--humo);background:var(--carbon);white-space:nowrap}
.nube.ok{border-color:rgba(179,157,232,.4);color:var(--salida)}
.nube.pend{border-color:rgba(240,200,98,.4);color:var(--alerta)}

/* ─── HERO: la fecha de salida ─── */
.hero{padding:26px 0 4px}
.hero-fecha{
  font-size:clamp(34px,10.5vw,46px);line-height:1.02;font-weight:700;
  letter-spacing:-.03em;color:var(--salida);margin-top:6px;
}
.hero-fecha.malo{color:var(--sangre)}
.hero-sub{font-size:13px;color:var(--humo);margin-top:8px}
.hero-sub b{color:var(--tiza);font-weight:500}

/* la cinta métrica: el elemento firma */
.regla{margin-top:20px;position:relative;height:56px}
.regla svg{width:100%;height:100%;display:block;overflow:visible}

/* ─── stats ─── */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:20px}
.stat{background:var(--carbon);border:1px solid var(--linea);border-radius:13px;padding:12px 10px}
.stat .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.stat .l{font-size:10px;color:var(--tenue);line-height:1.3;letter-spacing:.04em}
.stat.aviso{border-color:rgba(240,200,98,.45);background:rgba(240,200,98,.07)}
.stat.aviso .v{color:var(--alerta)}

/* ─── barras ─── */
.barra{height:5px;border-radius:99px;background:var(--linea);overflow:hidden;margin-top:9px}
.barra>i{display:block;height:100%;border-radius:99px;background:var(--salida);transition:width .35s ease}
.barra>i.medio{background:var(--alerta)}
.barra>i.alto{background:var(--sangre)}

/* ─── filas ─── */
.fila{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:none}
.fila:first-child{padding-top:0}
.fila .txt{flex:1;min-width:0}
.fila .t1{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .t2{font-size:11.5px;color:var(--tenue);margin-top:2px}
.fila .mto{font-size:14px;font-weight:500;white-space:nowrap}
.pos{color:var(--salida)}
.neg{color:var(--tiza)}
.chip{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.chip.inv{background:rgba(240,200,98,.16);color:var(--alerta)}
.chip.ext{background:rgba(179,157,232,.16);color:var(--salida)}
.chip.rul{background:rgba(255,138,138,.16);color:var(--sangre)}

/* ─── aviso ─── */
.aviso-bloque{border-radius:13px;padding:13px 14px;font-size:13px;line-height:1.4;margin-top:10px}
.aviso-bloque.rojo{background:rgba(255,138,138,.1);border:1px solid rgba(255,138,138,.3);color:#FFB3B3}
.aviso-bloque.ambar{background:rgba(240,200,98,.09);border:1px solid rgba(240,200,98,.28);color:#F7DFA6}
.aviso-bloque.verde{background:rgba(123,227,174,.09);border:1px solid rgba(123,227,174,.28);color:#A6EDC9}
.aviso-bloque b{font-weight:600}

/* ─── navegación ─── */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,23,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--linea);z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav-b{padding:11px 0 13px;text-align:center;color:var(--tenue);font-size:10px;letter-spacing:.05em}
.nav-b.on{color:var(--salida)}
.nav-b svg{display:block;margin:0 auto 3px;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acciones button{border:1px solid var(--linea);border-radius:9px;padding:6px 12px;font-size:12px;color:var(--tiza);background:transparent}
.acciones button.p{border-color:var(--salida);color:var(--salida)}
.rev-fila{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--linea);padding:9px 0;font-size:13px;color:var(--tiza)}
.rev-fila .acciones{margin-top:0}
.chips{display:flex;gap:6px;margin-bottom:6px}
.chips button{flex:1;border:1px solid var(--linea);border-radius:9px;padding:6px 0;font-size:12px;color:var(--humo);background:transparent}
.chips button.on{border-color:var(--salida);color:var(--salida)}
.otra-cosa{margin-top:14px;text-align:center;font-size:12px;color:var(--tenue)}
.otra-cosa button{color:var(--salida);font-size:12px}
.fab{position:fixed;right:calc(50% - 240px + 18px);bottom:86px;width:56px;height:56px;border-radius:50%;
  background:var(--salida);color:#1A1226;font-size:30px;font-weight:500;line-height:56px;text-align:center;
  box-shadow:0 6px 20px rgba(179,157,232,.32);z-index:31}
@media (max-width:516px){.fab{right:18px}}

/* ─── hoja modal ─── */
.tapa{position:fixed;inset:0;background:rgba(6,9,11,.72);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .16s ease}
.tapa.centro{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hoja{width:100%;max-width:480px;background:var(--carbon);border:1px solid var(--linea);
  border-radius:22px 22px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;animation:sube .22s cubic-bezier(.2,.8,.3,1)}
.tapa.centro .hoja{border-radius:18px;padding-bottom:18px}
@keyframes sube{from{transform:translateY(22px)}to{transform:translateY(0)}}
.hoja-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hoja-h h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.cerrar{font-size:19px;color:var(--tenue);padding:4px 8px}

/* ─── formulario ─── */
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tipo-b{border:1px solid var(--linea);border-radius:11px;padding:9px 2px;font-size:11.5px;
  color:var(--humo);text-align:center;background:var(--carbon2)}
.tipo-b.on{border-color:var(--salida);color:var(--salida);background:rgba(179,157,232,.1)}
.monto-caja{display:flex;align-items:center;gap:9px;border:1.5px solid var(--linea);
  border-radius:13px;padding:13px 15px;background:var(--carbon2)}
.monto-caja:focus-within{border-color:var(--salida)}
.monto-caja span{color:var(--tenue);font-size:19px}
.monto-caja input{width:100%;font-size:27px;font-weight:600;letter-spacing:-.02em;outline:none;min-width:0}
.eco{font-size:12.5px;margin-top:9px;min-height:18px;color:var(--tenue);line-height:1.35}
.eco b{font-weight:600}
.eco.mueve b{color:var(--alerta)}
.eco.bloqueo{color:var(--sangre)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.cat-b{border:1px solid var(--linea);border-radius:11px;padding:9px 3px;font-size:10.5px;
  color:var(--humo);text-align:center;background:var(--carbon2);line-height:1.25}
.cat-b.on{border-color:var(--salida);color:var(--tiza);background:rgba(179,157,232,.11)}
.cat-b i{display:block;font-size:17px;font-style:normal;margin-bottom:2px}

.campo{margin-top:11px}
.campo label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:5px}
.campo select,.campo input,.campo textarea{width:100%;background:var(--carbon2);border:1px solid var(--linea);
  border-radius:11px;padding:11px 13px;font-size:15px;outline:none}
.campo select:focus,.campo input:focus{border-color:var(--salida)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.marca-fila{display:flex;align-items:center;gap:9px;margin-top:13px;font-size:13.5px;color:var(--humo)}
.tick{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--tenue);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--noche)}
.tick.on{background:var(--alerta);border-color:var(--alerta)}
.btn{width:100%;border-radius:13px;padding:14px;font-weight:600;font-size:15.5px;
  background:var(--salida);color:#1A1226;margin-top:16px}
.btn:disabled{opacity:.32}
.btn.fantasma{background:none;border:1px solid var(--linea);color:var(--humo);margin-top:9px}
.btn.peligro{background:none;border:1px solid rgba(255,138,138,.4);color:var(--sangre)}

/* ─── brindis ─── */
.brindis{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:60;
  background:var(--carbon2);border:1px solid var(--linea);border-radius:12px;
  padding:11px 16px;font-size:13px;box-shadow:var(--sombra);max-width:88vw;text-align:center;
  animation:sube .2s ease}
.brindis b{color:var(--alerta)}

.vacio{text-align:center;padding:30px 18px;color:var(--tenue);font-size:13.5px;line-height:1.5}
.mini{font-size:11.5px;color:var(--tenue);margin-top:7px;line-height:1.45}
</style>
</head>
<body>
<div id="app"></div>
<div id="capa"></div>
<div id="brindis"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   DATOS INICIALES — se aplican una sola vez, si no hay nada guardado.
   Todo lo personal vive ACÁ ARRIBA. Nada de esto está clavado en la
   lógica de más abajo: cambiando este bloque la app sirve para otra
   persona sin reescribir una línea de código.
   Montos en CÉNTIMOS ENTEROS.
   ══════════════════════════════════════════════════════════════════ */
const SEMILLA = {
  cfg:{
    cur:"PEN", sim:"S/", fx:3.75,
    liquidoC:382096,               // sueldo líquido mensual
    metrica:"arrastre",
    repartoExt:null,               // decisión para CTS / gratificación
    cats:[
      {id:"comida",   n:"Comida",     e:"🍗"},
      {id:"salida",   n:"Salida",     e:"🌃"},
      {id:"trago",    n:"Trago",      e:"🍺"},
      {id:"taxi",     n:"Taxi",       e:"🚕"},
      {id:"pasaje",   n:"Pasaje",     e:"🚌"},
      {id:"compras",  n:"Ropa",       e:"👕"},
      {id:"setup",    n:"Setup",      e:"🖥️"},
      {id:"sub",      n:"Suscrip.",   e:"📱"},
      {id:"casa",     n:"Casa",       e:"🏠"},
      {id:"salud",    n:"Salud",      e:"➕"},
      {id:"regalo",   n:"Regalo",     e:"🎁"},
      {id:"otros",    n:"Otros",      e:"📦"}
    ]
  },
  ctas:[
    {id:"oro",   n:"VISA Oro",     tipo:"credito", banco:"BCP",       lineaC:1174000, saldoIniC:385618, cierre:11, vence:5, activa:1},
    {id:"amex",  n:"Black Amex",   tipo:"credito", banco:"Interbank", lineaC:1672000, saldoIniC:369547, cierre:10, vence:5, activa:1},
    {id:"clas",  n:"VISA Clásica", tipo:"credito", banco:"BCP",       lineaC:326000,  saldoIniC:0,      cierre:11, vence:5, activa:1},
    {id:"deb",   n:"Débito IBK",   tipo:"liquida", banco:"Interbank", lineaC:0,       saldoIniC:81076,  activa:1},
    {id:"efe",   n:"Efectivo",     tipo:"efectivo",banco:"",          lineaC:0,       saldoIniC:0,      activa:1}
  ],
  fijos:[
    {id:"f01", n:"Junta",           cC:100000, cat:"casa",  dia:31, cta:"amex", estado:"activo", ahorro:1},
    {id:"f02", n:"Casa",            cC:43500,  cat:"casa",  dia:1,  cta:"amex", estado:"activo"},
    {id:"f03", n:"Cochera",         cC:15000,  cat:"casa",  dia:1,  cta:"deb",  estado:"activo"},
    {id:"f04", n:"Internet",        cC:12300,  cat:"casa",  dia:3,  cta:"amex", estado:"activo"},
    {id:"f05", n:"ChatGPT",         cC:9064,   cat:"sub",   dia:20, cta:"oro",  estado:"activo", cur:"USD", cOrig:2417},
    {id:"f06", n:"Claude",          cC:8850,   cat:"sub",   dia:28, cta:"amex", estado:"activo", cur:"USD", cOrig:2360},
    {id:"f07", n:"Vóley",           cC:6500,   cat:"pasaje",dia:1,  cta:"efe",  estado:"activo", protegido:1},
    {id:"f08", n:"DirecTV TV",      cC:6150,   cat:"casa",  dia:5,  cta:"amex", estado:"activo", compC:6150},
    {id:"f09", n:"Seguro mamá",     cC:5000,   cat:"salud", dia:10, cta:"deb",  estado:"activo"},
    {id:"f10", n:"Celular",         cC:3993,   cat:"casa",  dia:14, cta:"amex", estado:"activo", compC:3992},
    {id:"f11", n:"Spotify",         cC:3290,   cat:"sub",   dia:19, cta:"oro",  estado:"activo"},
    {id:"f12", n:"Gym Net",         cC:3000,   cat:"salud", dia:20, cta:"amex", estado:"activo"},
    {id:"f13", n:"Degravamen",      cC:1544,   cat:"otros", dia:10, cta:"amex", estado:"revision"},
    {id:"f14", n:"BitePal (anual)", cC:917,    cat:"sub",   dia:1,  cta:"oro",  estado:"activo"}
  ],
  cuotas:[
    {id:"q01", n:"Mercadopago", cTotalC:99900, nCuotas:12, pagadas:0, cMesC:8325, cta:"amex",
     desde:"2026-08", hasta:"2027-07", tea:0, dia:11, fCompra:"2026-07-15"}
  ],
  junta:{n:"Junta 2026", cMesC:100000, numeros:12, miTurno:12, pagadas:7, cRecibirC:1200000, fEstimada:"2026-12"},
  eventos:[],
  deudas:[],
  sinGasto:[],
  movs:[],
  meses:{}
};

/* ══════════════════════════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════════════════════════ */
const LLAVE = "af_v1";
let S = cargar();
let ui = {
  vista:"hoy",
  hoja:null,          // registro | fijo | evento | cta | cerrar | ajusteLiquido
  tipo:"gasto",
  cat:null,
  cta:null,
  cta2:null,
  via:"fisica",
  inv:0,
  ext:0,
  editId:null,
  mesVer:claveMes(new Date())
};

function cargar(){
  try{
    const raw = localStorage.getItem(LLAVE);
    if(raw){
      const s = JSON.parse(raw);
      // migración blanda: campos nuevos no rompen datos viejos
      s.eventos = s.eventos || []; s.deudas = s.deudas || []; s.meses = s.meses || {};
      s.sinGasto = s.sinGasto || [];
      s.cfg.autoDesde = s.cfg.autoDesde || hoyISO();   // los cargos automáticos arrancan hoy, no hacia atrás
      // q01 estaba cargada a la Oro y sin fecha de término; el detalle del banco dice Interbank
      (s.cuotas||[]).forEach(q=>{ if(q.id==="q01"){ q.n="Mercadopago"; q.cta="amex";
        q.hasta=q.hasta||"2027-07"; q.dia=q.dia||11; q.tea=q.tea||0; q.fCompra=q.fCompra||"2026-07-15"; } });
      return s;
    }
  }catch(e){ console.warn("Estado ilegible, arranco con la semilla", e); }
  return JSON.parse(JSON.stringify(SEMILLA));
}
function guardar(){
  try{ localStorage.setItem(LLAVE, JSON.stringify(S)); }catch(e){ alert("No se pudo guardar."); }
  if(typeof cola === "function") cola();
}
function nuevoId(){
  if(crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}

/* ══════════════════════════════════════════════════════════════════
   AYUDANTES
   ══════════════════════════════════════════════════════════════════ */
const DIAS_N = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES_N = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];

function fmt(c){
  const v = (c||0)/100;
  return S.cfg.sim + " " + v.toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtCorto(c){
  const v = Math.round((c||0)/100);
  return S.cfg.sim + " " + v.toLocaleString("es-PE");
}
function aC(txt){
  const n = parseFloat(String(txt).replace(",","."));
  if(!isFinite(n)) return 0;
  return Math.round(n*100);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function isoDe(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hoyISO(){ return isoDe(new Date()); }
function claveMes(d){ return isoDe(d).slice(0,7); }
function diasDelMes(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function menosDias(n){ const d=new Date(); d.setDate(d.getDate()-n); return d; }
function delISO(iso){ const [a,m,d]=iso.split("-").map(Number); return new Date(a,m-1,d); }
function fechaLarga(d){
  return d.getDate()+" de "+MESES_N[d.getMonth()]+" de "+d.getFullYear();
}
function fechaCorta(iso){
  const d = delISO(iso);
  return d.getDate()+"/"+(d.getMonth()+1);
}
function cta(id){ return S.ctas.find(c=>c.id===id); }
function catDe(id){ return S.cfg.cats.find(c=>c.id===id); }

/* ── findes: la unidad de gasto real es el fin de semana (vie–dom) ── */
function findesDelMes(mesKey){
  const [a,m] = mesKey.split("-").map(Number);
  const ultimo = new Date(a, m, 0).getDate();
  const grupos = {};
  for(let d=1; d<=ultimo; d++){
    const f = new Date(a, m-1, d), wd = f.getDay();      // 0=dom 5=vie 6=sáb
    if(wd===5 || wd===6 || wd===0){
      // agrupa por el viernes de esa tanda
      const off = wd===5?0 : wd===6?1 : 2;
      const vie = new Date(a, m-1, d-off);
      const k = vie.toISOString().slice(0,10);
      (grupos[k] = grupos[k] || []).push(d);
    }
  }
  return Object.keys(grupos).sort().map(k=>({vie:k, dias:grupos[k]}));
}
function findesRestantes(mesKey){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const todos = findesDelMes(mesKey);
  if(mesKey !== claveMes(new Date())) return todos.length;
  return todos.filter(g=>{
    const vie = delISO(g.vie);
    const dom = new Date(vie); dom.setDate(dom.getDate()+2);
    return dom >= hoy;
  }).length;
}

/* ══════════════════════════════════════════════════════════════════
   CÁLCULO — el corazón de la app
   ══════════════════════════════════════════════════════════════════ */

/* Saldo de cada cuenta según los movimientos.
   Semántica (documentada en DECISIONES §6.2):
     gasto       cta = de dónde salió
     pago        cta = líquida origen · cta2 = tarjeta destino
     disposicion cta = tarjeta origen · cta2 = efectivo destino
     traslado    cta → cta2
     ingreso     cta = cuenta que recibe
     ahorro      cta = de dónde salió (ni gasto ni disponible)          */
function saldos(){
  const s = {};
  S.ctas.forEach(c=> s[c.id] = c.saldoIniC||0);
  S.movs.forEach(m=>{
    const esCred = id => { const c=cta(id); return c && c.tipo==="credito"; };
    if(m.tipo==="gasto" || m.tipo==="ahorro"){
      if(s[m.cta]==null) return;
      s[m.cta] += esCred(m.cta) ? m.cC : -m.cC;      // en tarjeta sube deuda
    } else if(m.tipo==="ingreso"){
      if(s[m.cta]!=null) s[m.cta] += m.cC;
    } else if(m.tipo==="pago"){
      if(s[m.cta]!=null)  s[m.cta]  -= m.cC;         // sale del líquido
      if(s[m.cta2]!=null) s[m.cta2] -= m.cC;         // baja la deuda
    } else if(m.tipo==="disposicion"){
      if(s[m.cta]!=null)  s[m.cta]  += m.cC;         // sube la deuda
      if(s[m.cta2]!=null) s[m.cta2] += m.cC;         // entra el efectivo
    } else if(m.tipo==="traslado"){
      if(s[m.cta]!=null)  s[m.cta]  -= m.cC;
      if(s[m.cta2]!=null) s[m.cta2] += m.cC;
    }
  });
  return s;
}

/* Lo que falta de cuotas en una tarjeta. El saldo del banco ya las incluye,
   así que el arrastre las resta: la cuota tiene fecha de término y se paga
   por fijos, no con la plata libre. */
function cuotasPendC(ctaId){
  return S.cuotas.filter(q=>q.cta===ctaId && q.pagadas<q.nCuotas)
    .reduce((t,q)=>t + q.cMesC*(q.nCuotas-q.pagadas), 0);
}
function revolventeCta(ctaId){
  const s = saldos();
  return Math.max(0, (s[ctaId]||0) - cuotasPendC(ctaId));
}
function deudaRevolvente(){
  return S.ctas.filter(c=>c.tipo==="credito").reduce((t,c)=>t + revolventeCta(c.id), 0);
}
function efectivoPendiente(){
  const s = saldos();
  const e = S.ctas.find(c=>c.tipo==="efectivo");
  return e ? Math.max(0, s[e.id]||0) : 0;
}
/* ── Cargos automáticos ───────────────────────────────────────────
   El fijo ya se descuenta del libre como bloque, pero el banco lo carga
   a una tarjeta. Sin movimiento, el saldo de la app se queda por debajo
   del real y el arrastre se ve mejor de lo que es.
   No se aplican los que salen de efectivo: ese saldo depende de una
   disposición registrada (baranda 7).
   Tampoco se aplica nada anterior a `autoDesde`: los saldos iniciales se
   midieron ese día y ya incluían los cargos previos. */
function aplicarFijos(){
  const hoy = new Date(), mk = claveMes(hoy), diaHoy = hoy.getDate();
  if(S.meses[mk] && S.meses[mk].cerrado) return 0;
  const desde = S.cfg.autoDesde || hoyISO();
  let n = 0;
  S.fijos.forEach(f=>{
    if(f.estado === "cancelado") return;
    const c = cta(f.cta);
    if(!c || c.tipo === "efectivo") return;
    const dia = Math.min(f.dia||1, diasDelMes(hoy));
    if(diaHoy < dia) return;
    const d = mk+"-"+String(dia).padStart(2,"0");
    if(d <= desde) return;
    if(S.movs.some(m=>m.fijoId===f.id && m.d.slice(0,7)===mk)) return;
    S.movs.push({ id:nuevoId(), d, ts:Date.now(), cC:f.cC, cur:S.cfg.cur,
      tipo: f.ahorro ? "ahorro" : "gasto", cat:f.cat, cta:f.cta, cta2:null,
      via:"transferencia", inv:0, ext:0, src:"auto", fijoId:f.id, rev:0, nota:f.n });
    n++;
  });
  if(n) guardar();
  return n;
}
function porRevisar(mk){ return S.movs.filter(m=>m.fijoId && !m.rev && m.d.slice(0,7)===mk); }

/* Días de finde ya pasados sin un solo registro. Un finde en cero real y
   uno sin anotar se ven igual en pantalla, y son lo contrario. */
function findesSinRegistro(){
  const out=[], desde = S.cfg.autoDesde || hoyISO();
  for(let i=1;i<=7;i++){
    const d = menosDias(i), dw = d.getDay();
    if(dw!==5 && dw!==6 && dw!==0) continue;
    const iso = isoDe(d);
    if(iso < desde) continue;
    if((S.sinGasto||[]).includes(iso)) continue;
    if(S.movs.some(m=>m.d===iso && m.src!=="auto" && (m.tipo==="gasto"||m.tipo==="disposicion"))) continue;
    out.push(iso);
  }
  return out;
}
function deudasVencidas(){
  const hoy = new Date();
  return (S.deudas||[]).filter(x=>x.sentido==="meDeben" && x.estado==="abierto" &&
    Math.round((hoy - delISO(x.desde))/86400000) >= 30);
}

function fijosMesC(){
  return S.fijos.filter(f=>f.estado!=="cancelado").reduce((t,f)=>t+f.cC,0);
}
function mesLargo(ym){ const p=String(ym).split("-"); return MESES_N[parseInt(p[1],10)-1]+" "+p[0]; }

function cuotasMesC(){
  return S.cuotas.filter(q=>q.pagadas < q.nCuotas).reduce((t,q)=>t+q.cMesC,0);
}
function eventosMesC(mesKey){
  return S.eventos.filter(e=>e.estado==="pendiente" && e.fecha.slice(0,7)===mesKey)
                  .reduce((t,e)=>t+e.cC,0);
}
/* Libre del mes = líquido − fijos − cuotas − eventos agendados */
function libreC(mesKey){
  return S.cfg.liquidoC - fijosMesC() - cuotasMesC() - eventosMesC(mesKey);
}
/* Gasto discrecional registrado en el mes (los fijos no cuentan acá:
   ya están descontados del libre). */
function gastadoC(mesKey){
  return S.movs.filter(m=>m.tipo==="gasto" && !m.fijoId && m.d.slice(0,7)===mesKey)
               .reduce((t,m)=>t+m.cC,0);
}
function invitadoC(mesKey){
  return S.movs.filter(m=>m.tipo==="gasto" && m.inv && m.d.slice(0,7)===mesKey)
               .reduce((t,m)=>t+m.cC,0);
}

/* Ritmo del mes: se usa el gasto REAL registrado, no una extrapolación.
   Extrapolar desde un finde suelto hace saltar la fecha semanas por un solo
   gasto, y un número que salta deja de creerse. Lectura correcta:
   "si el mes termina como va hasta ahora, salgo tal día". */

/* LA FECHA DE SALIDA.
   abono = libre − gasto discrecional del mes. deuda / abono = meses.
   extraC simula un gasto que todavía no se guardó, para mostrar la
   consecuencia ANTES de gastar. */
/* Ritmo mensual: lo que abonas mes tras mes. Los eventos NO entran acá.
   Un cumpleaños de 300 sale una vez; restarlo del ritmo equivale a decir
   que tu papá cumple años todos los meses hasta que salgas de deuda. */
function ritmoC(mesKey){
  return S.cfg.liquidoC - fijosMesC() - cuotasMesC() - gastadoC(mesKey);
}
function fechaSalida(extraC){
  extraC = extraC || 0;
  const hoy = new Date(), mk = claveMes(hoy);
  let deuda = deudaRevolvente();
  const ritmo = ritmoC(mk) - extraC;
  const abono0 = ritmo - eventosMesC(mk);
  if(deuda <= 0) return {ok:true, libre:true, abonoC:abono0};
  if(ritmo <= 0) return {ok:false, abonoC:abono0};

  /* Simulación mes a mes: cada evento se descuenta el mes que le toca y
     nunca más. Antes se restaba de todos los meses y una salida de 600
     atrasaba la fecha 82 días en vez de 19. */
  let dias = 0, m = 0;
  while(deuda > 0 && m < 600){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()+m, 1);
    const abono = ritmo - eventosMesC(claveMes(d));
    if(abono > 0){
      if(deuda <= abono){ dias += (deuda/abono)*30.44; deuda = 0; break; }
      deuda -= abono;
    }
    dias += 30.44; m++;
  }
  if(deuda > 0) return {ok:false, abonoC:abono0};
  const f = new Date(); f.setDate(f.getDate() + Math.round(dias));
  return {ok:true, fecha:f, meses:dias/30.44, dias, abonoC:abono0, deudaC:deudaRevolvente()};
}

/* Ruleteo: disposición y pago sobre la MISMA cuenta en ≤3 días.
   Se detecta solo y no se puede desmarcar a mano (baranda 5). */
function ruleteos(mesKey){
  const out = [];
  const disp = S.movs.filter(m=>m.tipo==="disposicion");
  const pagos = S.movs.filter(m=>m.tipo==="pago");
  disp.forEach(d=>{
    pagos.forEach(p=>{
      if(p.cta2 !== d.cta) return;
      const dif = Math.abs(delISO(p.d) - delISO(d.d)) / 86400000;
      if(dif <= 3){
        const k = d.d.slice(0,7);
        if(!mesKey || k===mesKey) out.push({disp:d, pago:p, dias:Math.round(dif)});
      }
    });
  });
  return out;
}

/* ─────────────────────── HOY ─────────────────────── */
function vistaHoy(){
  const mk = claveMes(new Date());
  const fs = fechaSalida();
  const deuda = deudaRevolvente();
  const libre = libreC(mk);
  const gast = gastadoC(mk);
  const disp = libre - gast;
  const rest = findesRestantes(mk);
  const efe = efectivoPendiente();
  const ratio = S.cfg.liquidoC ? deuda / S.cfg.liquidoC : 0;
  const porFinde = rest>0 ? Math.max(0, Math.round(disp/rest)) : 0;
  const rul = ruleteos(mk);

  /* héroe */
  let hero;
  if(deuda<=0){
    hero = '<div class="hero"><div class="eyebrow">Deuda revolvente</div>'+
      '<div class="hero-fecha">En cero</div>'+
      '<div class="hero-sub">Ya no arrastras nada. Toca empezar a ahorrar.</div></div>';
  } else if(!fs.ok){
    hero = '<div class="hero"><div class="eyebrow">Fecha de salida</div>'+
      '<div class="hero-fecha malo">Sin fecha</div>'+
      '<div class="hero-sub">Al ritmo de este mes no queda nada para abonar. '+
      'Baja el gasto y la fecha aparece sola.</div></div>';
  } else {
    hero = '<div class="hero"><div class="eyebrow">Sin deuda el</div>'+
      '<div class="hero-fecha">'+fechaLarga(fs.fecha)+'</div>'+
      '<div class="hero-sub">Si el mes cierra así, abonas <b>'+fmt(fs.abonoC)+'</b> · '+
      'faltan <b>'+fs.meses.toFixed(1)+' meses</b></div>'+
      regla(fs)+'</div>';
  }

  /* stats */
  const pctGast = libre>0 ? Math.min(100, gast/libre*100) : 100;
  const stats = '<div class="stats">'+
    '<div class="stat"><div class="l">Libre este mes</div>'+
      '<div class="v num'+(disp<0?" ":"")+'" style="'+(disp<0?"color:var(--sangre)":"")+'">'+fmtCorto(disp)+'</div>'+
      '<div class="barra"><i class="'+(pctGast>=100?"alto":pctGast>=80?"medio":"")+'" style="width:'+pctGast+'%"></i></div></div>'+
    '<div class="stat"><div class="l">Findes que quedan</div>'+
      '<div class="v num">'+rest+'</div>'+
      '<div class="mini">'+(rest>0?fmtCorto(porFinde)+" c/u":"cerró el mes")+'</div></div>'+
    '<div class="stat'+(efe>0?" aviso":"")+'"><div class="l">Efectivo sin registrar</div>'+
      '<div class="v num">'+fmtCorto(efe)+'</div>'+
      (efe>0?'<div class="mini">falta decir en qué se fue</div>':'<div class="mini">todo asignado</div>')+'</div>'+
  '</div>';

  /* avisos */
  let avisos = "";
  if(efe>0){
    avisos += '<div class="aviso-bloque ambar">Sacaste efectivo y <b>'+fmt(efe)+'</b> todavía no tienen destino. '+
      'Mientras no se registre, el gasto del mes está incompleto. '+
      '<button onclick="abrirRegistro(\'gasto\',\'efe\')" style="color:var(--alerta);text-decoration:underline;font-size:13px">Asignar</button></div>';
  }
  if(rul.length){
    avisos += '<div class="aviso-bloque rojo"><b>Ruleteo detectado ('+rul.length+').</b> '+
      'Sacaste efectivo de una tarjeta y le pagaste a esa misma tarjeta. La deuda no bajó: rotó. '+
      'El mes no cerró solo.</div>';
  }
  if(disp<0){
    avisos += '<div class="aviso-bloque rojo">Te pasaste <b>'+fmt(-disp)+'</b> de lo libre del mes. '+
      'Todo lo que gastes desde acá sale del abono.</div>';
  }
  findesSinRegistro().slice(0,2).forEach(iso=>{
    const d = delISO(iso);
    avisos += '<div class="aviso-bloque">El '+DIAS_N[d.getDay()]+' '+d.getDate()+' no anotaste nada. ¿Fue así?'+
      '<div class="acciones">'+
        '<button onclick="marcarSinGasto(\''+iso+'\')">No gasté</button>'+
        '<button class="p" onclick="abrirRegistro(\'gasto\',null,\''+iso+'\')">Anotar</button>'+
      '</div></div>';
  });
  deudasVencidas().forEach(x=>{
    const dias = Math.round((new Date() - delISO(x.desde))/86400000);
    avisos += '<div class="aviso-bloque ambar">Le cubriste <b>'+fmt(x.cC)+'</b> a '+esc(x.n)+' hace '+dias+' días y no lo has cobrado.'+
      '<div class="acciones">'+
        '<button onclick="cobrarDeuda(\''+x.id+'\')">Ya me pagó</button>'+
        '<button class="p" onclick="soltarDeuda(\''+x.id+'\')">Soltarlo</button>'+
      '</div></div>';
  });
  const rev = porRevisar(mk);
  if(rev.length){
    avisos += '<div class="aviso-bloque"><b>'+rev.length+(rev.length===1?' cargo automático':' cargos automáticos')+' este mes.</b> '+
      'Confirma contra el banco: un cobro repetido se ve acá, no en diciembre.'+
      rev.map(m=>'<div class="rev-fila"><span>'+esc(m.nota||"")+' · '+fmt(m.cC)+'</span>'+
        '<span class="acciones">'+
          '<button onclick="fijoOk(\''+m.id+'\')">Llegó</button>'+
          '<button onclick="fijoNo(\''+m.id+'\')">No llegó</button>'+
          '<button onclick="fijoOtro(\''+m.id+'\')">Distinto</button>'+
        '</span></div>').join("")+'</div>';
  }

  /* tarjetas — nunca se muestra la línea disponible como número (baranda 6c) */
  const s = saldos();
  const tarjetas = S.ctas.filter(c=>c.tipo==="credito" && c.activa).map(c=>{
    const sc = Math.max(0, s[c.id]||0);
    const pct = c.lineaC ? Math.min(100, sc/c.lineaC*100) : 0;
    return '<div class="fila"><div class="txt">'+
      '<div class="t1">'+esc(c.n)+'</div>'+
      '<div class="t2">'+esc(c.banco)+' · usas el '+pct.toFixed(1)+'% · vence el '+c.vence+'</div>'+
      (cuotasPendC(c.id) ? '<div class="t2" style="color:var(--tenue)">incluye '+fmt(cuotasPendC(c.id))+' en cuotas · fuera del arrastre</div>' : '')+
      '<div class="barra" style="max-width:190px"><i class="'+(pct>=60?"alto":pct>=35?"medio":"")+'" style="width:'+pct+'%"></i></div>'+
      '</div><div class="mto num">'+fmt(sc)+'</div></div>';
  }).join("");

  const liq = S.ctas.filter(c=>c.tipo==="liquida").map(c=>
    '<div class="fila"><div class="txt"><div class="t1">'+esc(c.n)+'</div>'+
    '<div class="t2">disponible de verdad</div></div>'+
    '<div class="mto num pos">'+fmt(s[c.id]||0)+'</div></div>').join("");

  /* junta y cuotas */
  const j = S.junta;
  const junta = j ? '<div class="fila"><div class="txt">'+
      '<div class="t1">'+esc(j.n)+'</div>'+
      '<div class="t2">'+j.pagadas+' de '+j.numeros+' · eres el número '+j.miTurno+
        ' · cobras en '+MESES_N[parseInt(j.fEstimada.slice(5,7))-1]+'</div>'+
      '<div class="barra" style="max-width:190px"><i style="width:'+(j.pagadas/j.numeros*100)+'%"></i></div>'+
    '</div><div class="mto num pos">'+fmtCorto(j.cRecibirC)+'</div></div>'+
    '<div class="mini" style="padding-top:8px">No es plata disponible ni gasto perdido: es ahorro ilíquido con destino propio. La deuda se mata con el sueldo.</div>' : "";

  const cuotas = S.cuotas.filter(q=>q.pagadas<q.nCuotas).map(q=>
    '<div class="fila"><div class="txt"><div class="t1">'+esc(q.n)+'</div>'+
    '<div class="t2">'+q.pagadas+' de '+q.nCuotas+' pagadas · sin interés'+(q.hasta?' · termina '+mesLargo(q.hasta):'')+'</div></div>'+
    '<div class="mto num">'+fmt(q.cMesC)+'</div></div>').join("");

  const inv = invitadoC(mk);
  const invLinea = inv>0 ? '<div class="aviso-bloque ambar" style="margin-top:14px">'+
    'Invitaste <b>'+fmt(inv)+'</b> este mes · '+(inv/S.cfg.liquidoC*100).toFixed(0)+'% de tu líquido.</div>' : "";

  return hero + stats + avisos +
    '<div class="sect"><div class="sect-h"><div class="eyebrow">Arrastre</div>'+
      '<div class="num" style="font-size:12px;color:var(--humo)">'+ratio.toFixed(2)+' sueldos</div></div>'+
      '<div class="card">'+tarjetas+'</div>'+
      (liq?'<div class="card">'+liq+'</div>':'')+
    '</div>'+
    (cuotas?'<div class="sect"><div class="eyebrow">Cuotas</div><div class="card" style="margin-top:10px">'+cuotas+'</div></div>':'')+
    (junta ?'<div class="sect"><div class="eyebrow">Junta</div><div class="card" style="margin-top:10px">'+junta+'</div></div>':'')+
    invLinea +
    '<div style="height:26px"></div>';
}

/* La cinta métrica: cada tick es un mes; la marca es la salida. */
function regla(fs){
  const meses = Math.max(1, Math.ceil(fs.meses));
  const total = Math.max(meses, 6);
  const W = 100;
  let ticks = "";
  const hoy = new Date();
  for(let i=0;i<=total;i++){
    const x = i/total*W;
    const alto = i%3===0;
    ticks += '<line x1="'+x+'%" y1="16" x2="'+x+'%" y2="'+(alto?30:24)+'" stroke="var(--linea)" stroke-width="1"/>';
    if(alto){
      const d = new Date(hoy.getFullYear(), hoy.getMonth()+i, 1);
      ticks += '<text x="'+x+'%" y="43" fill="var(--tenue)" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="'+(i===0?"start":i===total?"end":"middle")+'">'+
        MESES_N[d.getMonth()].slice(0,3)+'</text>';
    }
  }
  const px = Math.min(100, fs.meses/total*100);
  return '<div class="regla"><svg style="height:56px">'+
    '<line x1="0" y1="16" x2="100%" y2="16" stroke="var(--linea)" stroke-width="1"/>'+
    '<line x1="0" y1="16" x2="'+px+'%" y2="16" stroke="var(--salida)" stroke-width="3" stroke-linecap="round"/>'+
    ticks+
    '<circle cx="'+px+'%" cy="16" r="4.5" fill="var(--salida)"/>'+
    '</svg></div>';
}

/* ─────────────────────── MOVIMIENTOS ─────────────────────── */
function vistaMovs(){
  const mk = ui.mesVer;
  const lista = S.movs.filter(m=>m.d.slice(0,7)===mk).sort((a,b)=> a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0));
  const rulIds = new Set(); ruleteos(mk).forEach(r=>{rulIds.add(r.disp.id); rulIds.add(r.pago.id);});

  const filas = lista.map(m=>{
    const c = catDe(m.cat);
    const orig = cta(m.cta);
    const etiqueta =
      m.tipo==="pago" ? "Pago a "+(cta(m.cta2)||{n:"?"}).n :
      m.tipo==="disposicion" ? "Disposición de "+(orig||{n:"?"}).n :
      m.tipo==="ingreso" ? (m.nota||"Ingreso") :
      m.tipo==="ahorro" ? (m.nota||"Ahorro") :
      (m.nota || (c?c.n:"Gasto"));
    const signo = (m.tipo==="ingreso") ? "pos" : "neg";
    const pre = (m.tipo==="ingreso") ? "+" : (m.tipo==="pago"||m.tipo==="disposicion"||m.tipo==="traslado") ? "" : "−";
    const chips = (m.inv?'<span class="chip inv">invitó</span>':'')+
                  (m.ext?'<span class="chip ext">extra</span>':'')+
                  (rulIds.has(m.id)?'<span class="chip rul">ruleteo</span>':'');
    return '<div class="fila"><div class="txt">'+
      '<div class="t1">'+esc(etiqueta)+chips+'</div>'+
      '<div class="t2">'+fechaCorta(m.d)+' · '+(orig?esc(orig.n):"?")+(m.via&&m.tipo==="gasto"?" · "+esc(m.via):"")+'</div>'+
      '</div><div class="mto num '+signo+'">'+pre+fmt(m.cC).replace(S.cfg.sim+" ","")+'</div>'+
      '<button onclick="borrarMov(\''+m.id+'\')" style="color:var(--tenue);padding:4px 2px;font-size:15px" aria-label="Borrar">×</button></div>';
  }).join("");

  const gast = gastadoC(mk), libre = libreC(mk);
  const meses = [...new Set(S.movs.map(m=>m.d.slice(0,7)))].sort().reverse();
  if(!meses.includes(mk)) meses.unshift(mk);
  const sel = '<select onchange="ui.mesVer=this.value;render()" style="background:var(--carbon2);border:1px solid var(--linea);border-radius:9px;padding:6px 9px;font-size:12px">'+
    meses.map(k=>'<option value="'+k+'"'+(k===mk?" selected":"")+'>'+MESES_N[+k.slice(5,7)-1]+" "+k.slice(0,4)+'</option>').join("")+'</select>';

  return '<div class="sect" style="margin-top:20px"><div class="sect-h">'+
      '<div class="eyebrow">Movimientos · '+lista.length+'</div>'+sel+'</div>'+
    '<div class="card"><div class="fila"><div class="txt"><div class="t1">Gasto discrecional</div>'+
      '<div class="t2">de '+fmt(libre)+' libres</div></div>'+
      '<div class="mto num">'+fmt(gast)+'</div></div></div>'+
    (lista.length? '<div class="card">'+filas+'</div>'
      : '<div class="card vacio">Nada registrado en este mes.<br>Toca el + y anota el primero.</div>')+
    '<div style="height:26px"></div></div>';
}

/* El eco: la consecuencia ANTES del gasto. */
function ecoFecha(){
  const el = document.getElementById("eco");
  if(!el) return;
  const v = document.getElementById("monto");
  const c = aC(v ? v.value : 0);
  if(!c){ el.className="eco"; el.textContent = ui.tipo==="gasto" ? "Escribe el monto y te digo cuánto mueve tu fecha." : ""; return; }

  if(ui.tipo==="gasto"){
    const ctaSel = document.getElementById("f-cta");
    const origen = ctaSel ? cta(ctaSel.value) : null;
    if(origen && origen.tipo==="efectivo"){
      const pend = efectivoPendiente();
      if(c > pend){
        el.className = "eco bloqueo";
        el.innerHTML = "Solo tienes "+fmt(pend)+" de efectivo sin asignar. Registra primero la disposición.";
        return;
      }
    }
    const antes = fechaSalida(0), desp = fechaSalida(c);
    if(!antes.ok || !desp.ok || antes.libre){ el.className="eco"; el.textContent=""; return; }
    const dias = Math.round(desp.dias - antes.dias);
    el.className = "eco mueve";
    el.innerHTML = dias>0
      ? "Si el mes cierra así, sales el <b>"+fechaLarga(desp.fecha)+"</b> · <b>+"+dias+(dias===1?" día":" días")+"</b>"
      : "Tu fecha de salida no se mueve con esto.";
  } else if(ui.tipo==="pago"){
    el.className="eco"; el.innerHTML = "Baja tu deuda en <b>"+fmt(c)+"</b>. No cuenta como gasto.";
  } else if(ui.tipo==="disposicion"){
    el.className="eco"; el.innerHTML = "Quedan <b>"+fmt(c)+"</b> de efectivo por asignar.";
  } else {
    el.className="eco"; el.innerHTML = "Entra <b>"+fmt(c)+"</b>.";
  }
}

/* Prellenado: la última cuenta y vía usadas en esa categoría (tres toques). */
function recordarCta(catId){
  const ult = [...S.movs].reverse().find(m=>m.tipo==="gasto" && m.cat===catId);
  if(ult && cta(ult.cta)) return ult.cta;
  const c = S.ctas.find(x=>x.tipo==="credito"&&x.activa) || S.ctas[0];
  return c ? c.id : null;
}
function recordarVia(catId){
  const ult = [...S.movs].reverse().find(m=>m.tipo==="gasto" && m.cat===catId);
  return ult && ult.via ? ult.via : "fisica";
}

window.guardarMov = () => {
  const c = aC(document.getElementById("monto").value);
  if(c<=0){ toast("Falta el monto."); return; }
  const d = document.getElementById("f-fecha").value || ui.fecha || hoyISO();
  const nota = (document.getElementById("f-nota").value||"").trim();
  const sel = id => { const e=document.getElementById(id); return e ? e.value : null; };
  const origen = sel("f-cta") || ui.cta;
  const destino = sel("f-cta2") || ui.cta2;

  // Baranda 7: el gasto en efectivo no puede exceder lo que se sacó.
  if(ui.tipo==="gasto"){
    const o = cta(origen);
    if(o && o.tipo==="efectivo" && c > efectivoPendiente()){
      toast("Solo tienes "+fmt(efectivoPendiente())+" de efectivo sin asignar.");
      return;
    }
  }
  // Mes cerrado inmutable (baranda 1).
  if(S.meses[d.slice(0,7)] && S.meses[d.slice(0,7)].cerrado){
    toast("Ese mes ya está cerrado. No se puede tocar.");
    return;
  }

  const antes = fechaSalida(0);
  const mov = {
    id:nuevoId(), d, ts:Date.now(), cC:c, cur:S.cfg.cur,
    tipo:ui.tipo,
    cat: ui.tipo==="gasto" ? ui.cat : null,
    cta: origen, cta2: destino,
    via: ui.tipo==="gasto" ? (sel("f-via")||ui.via) : null,
    inv: ui.tipo==="gasto" ? ui.inv : 0,
    ext: ui.tipo==="ingreso" ? ui.ext : 0,
    src:"manual", nota
  };
  /* "Me deben" no baja el gasto: lo anota completo y abre el pendiente aparte.
     Si descontara por adelantado, un cobro que nunca ocurre esconde gasto. */
  if(ui.tipo==="gasto" && ui.deb){
    const quien = (sel("f-quien")||"").trim() || "alguien";
    const debC = aC(sel("f-debc")) || Math.round(c/2);
    mov.debC = debC; mov.quien = quien;
    S.deudas.push({ id:nuevoId(), n:quien, cC:debC, sentido:"meDeben",
      motivo: nota || (ui.cat||""), desde:d, estado:"abierto", movId:mov.id });
  }
  S.movs.push(mov);
  guardar();

  // el eco después de guardar: cuánto se movió la fecha
  let msg = "Guardado.";
  if(ui.tipo==="gasto"){
    const desp = fechaSalida(0);
    if(antes.ok && desp.ok && !antes.libre && !desp.libre){
      const dias = Math.round(desp.dias - antes.dias);
      if(dias>0) msg = "Tu fecha de salida se movió <b>"+dias+(dias===1?" día":" días")+"</b>.";
    }
  } else if(ui.tipo==="pago"){
    msg = "Deuda abajo. Ahora debes "+fmt(deudaRevolvente())+".";
  } else if(ui.tipo==="disposicion"){
    msg = "Quedan "+fmt(efectivoPendiente())+" por asignar.";
  } else if(ui.tipo==="ingreso" && ui.ext){
    msg = "Ingreso extraordinario. Decide su reparto antes de gastarlo.";
  }
  cerrarHoja(); render(); toast(msg, mov.id);
};

/* ══════════════════════════════════════════════════════════════════
   SINCRONIZACIÓN (Firebase Auth + Firestore)

   Cada colección viaja como un documento en users/{uid}/af/{tajada}.
   Lo sucio no se marca a mano: se compara la huella de cada tajada
   contra la última que se subió. Así no hay forma de que un guardado
   se olvide de avisar. Último en escribir gana, por tajada.
   Sin configuración de Firebase, todo esto queda apagado y la app
   sigue funcionando solo con el almacenamiento del teléfono.
   ══════════════════════════════════════════════════════════════════ */
const TAJADAS = ["cfg","ctas","movs","fijos","cuotas","junta","eventos","deudas","sinGasto","meses"];
const LL_HUELLA = "af_huellas";     // lo último subido
const LL_REMOTO = "af_remoto";      // marca de tiempo de lo último bajado
let FBU = null, ocupado = false, temporizador = null;

function huella(txt){
  let h = 5381;
  for(let i=0;i<txt.length;i++) h = ((h<<5) + h + txt.charCodeAt(i)) | 0;
  return h.toString(36) + ":" + txt.length;
}
function leerMapa(k){ try{ return JSON.parse(localStorage.getItem(k)) || {}; }catch(e){ return {}; } }
function escribirMapa(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function sucias(){
  const prev = leerMapa(LL_HUELLA);
  return TAJADAS.filter(t => huella(JSON.stringify(S[t] === undefined ? null : S[t])) !== prev[t]);
}
function cola(){
  pintarNube();
  if(temporizador) clearTimeout(temporizador);
  temporizador = setTimeout(empujar, 2500);
}

async function empujar(){
  if(!window.FB || !FBU || ocupado || !navigator.onLine) return pintarNube();
  const pend = sucias();
  if(!pend.length) return pintarNube();
  ocupado = true; pintarNube("sync");
  try{
    const F = window.FB;
    const hs = leerMapa(LL_HUELLA), rem = leerMapa(LL_REMOTO);
    for(const t of pend){
      const val = S[t] === undefined ? null : S[t];
      const u = Date.now();
      await F.setDoc(F.doc(F.db,"users",FBU.uid,"af",t), {d:JSON.parse(JSON.stringify(val)), u});
      hs[t] = huella(JSON.stringify(val));
      rem[t] = u;
    }
    escribirMapa(LL_HUELLA, hs); escribirMapa(LL_REMOTO, rem);
  }catch(e){ console.error("Subida:", e); }
  ocupado = false; pintarNube();
}

async function bajar(){
  if(!window.FB || !FBU || !navigator.onLine) return;
  pintarNube("sync");
  try{
    const F = window.FB;
    const rem = leerMapa(LL_REMOTO), hs = leerMapa(LL_HUELLA);
    const snap = await F.getDocs(F.collection(F.db,"users",FBU.uid,"af"));
    let cambio = false;
    snap.forEach(doc=>{
      const t = doc.id, r = doc.data();
      if(TAJADAS.indexOf(t) < 0) return;
      if(!(r.u > (rem[t]||0))) return;            // ya lo tenemos
      S[t] = r.d;
      rem[t] = r.u;
      hs[t] = huella(JSON.stringify(r.d));
      cambio = true;
    });
    escribirMapa(LL_REMOTO, rem); escribirMapa(LL_HUELLA, hs);
    if(cambio){
      S.eventos = S.eventos||[]; S.deudas = S.deudas||[]; S.meses = S.meses||{}; S.sinGasto = S.sinGasto||[];
      localStorage.setItem(LLAVE, JSON.stringify(S));
      render();
      toast("Datos actualizados desde la nube.");
    }
  }catch(e){ console.error("Bajada:", e); }
  pintarNube();
}

function pintarNube(estado){
  const c = document.getElementById("nube");
  if(!c) return;
  if(!window.FB){ c.textContent = "☁ local"; c.className = "nube"; return; }
  if(!FBU){ c.textContent = "☁ conectar"; c.className = "nube"; return; }
  if(estado === "sync"){ c.textContent = "☁ ⟳"; c.className = "nube"; return; }
  if(!navigator.onLine){ c.textContent = "☁ sin red"; c.className = "nube pend"; return; }
  const n = sucias().length;
  c.textContent = n ? "☁ "+n+"↑" : "☁ ✓";
  c.className = "nube " + (n ? "pend" : "ok");
}

window.tocarNube = () => {
  if(!window.FB){ toast("Falta configurar Firebase en <b>firebase-config.js</b>."); return; }
  if(!FBU){ entrar(); return; }
  if(confirm("Conectado como "+(FBU.email||"")+".\n\nAceptar: sincronizar ahora.\nCancelar: cerrar sesión.")){
    bajar().then(empujar);
  } else {
    window.FB.signOut(window.FB.auth);
  }
};
function entrar(){
  const F = window.FB; if(!F) return;
  F.signInWithPopup(F.auth, F.provider).catch(e=>{
    const c = (e && e.code) || "";
    if(c.indexOf("popup") > -1) F.signInWithRedirect(F.auth, F.provider).catch(x=>alert("Entrar: "+(x.code||x.message)));
    else alert("Error: "+(c || e.message));
  });
}
window.fbInit = F => {
  window.FB = F;
  F.onAuthStateChanged(F.auth, async u => {
    FBU = u; pintarNube();
    if(u){ await bajar(); await empujar(); render(); }
  });
  window.addEventListener("online", ()=>{ pintarNube(); empujar(); });
  window.addEventListener("offline", pintarNube);
  setInterval(()=>{ if(sucias().length) empujar(); }, 60000);
  pintarNube();
};

/* ─── service worker: la app abre sin internet ─── */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW no registrado", e));
  });
}

/* Los cargos automáticos se aplican al abrir, nunca hacia atrás del día
   en que se midieron los saldos. */
S.cfg.autoDesde = S.cfg.autoDesde || hoyISO();
S.sinGasto = S.sinGasto || [];
guardar();
aplicarFijos();

render();
</script>

<script src="firebase-config.js"></script>
<script type="module">
/* Arranque de Firebase. Si firebase-config.js no está configurado,
   la app sigue funcionando en local y el indicador dice "local". */
try{
  const cfg = window.AF_FIREBASE;
  if(cfg && cfg.apiKey && cfg.apiKey.indexOf("PEGA_") !== 0){
    const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut}
      = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const {getFirestore,doc,getDoc,setDoc,collection,getDocs}
      = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = initializeApp(cfg);
    const auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();
    getRedirectResult(auth).catch(()=>{});
    window.fbInit({auth,db,provider,doc,getDoc,setDoc,collection,getDocs,onAuthStateChanged,signInWithPopup,signInWithRedirect,signOut});
  }
}catch(e){ console.warn("Firebase:", e); }
</script>
